name: fishing_with_friends
description: "Fishing with Friends — social angling app by Bunshin Development Studios"
publish_to: 'none'
version: 1.0.0+9

environment:
  sdk: ^3.11.5

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  cupertino_icons: ^1.0.8
  drift: ^2.19.1
  drift_flutter: ^0.2.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_hooks: ^0.20.5
  flutter_local_notifications: ^17.2.4
  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^3.0.2
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  geolocator: ^13.0.2
  go_router: ^14.6.2
  hooks_riverpod: ^2.6.1
  http: ^1.2.0
  image_picker: ^1.1.2
  internet_connection_checker_plus: ^2.5.2
  intl: ^0.20.1
  json_annotation: ^4.9.0
  latlong2: ^0.9.1
  meta: ^1.16.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  riverpod_annotation: ^2.6.1
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  sqlite3_flutter_libs: ^0.5.26
  supabase_flutter: ^2.8.4
  uuid: ^4.5.0

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  drift_dev: ^2.19.1
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  image: ^4.3.0
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  very_good_analysis: ^7.0.0

# App icon generator — `dart run flutter_launcher_icons` after the PNGs
# at the paths below exist (run `dart run tool/generate_placeholder_icon.dart`
# once if you don't have designer art yet).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#102B47"
  adaptive_icon_background: "#102B47"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# Launch screen — `dart run flutter_native_splash:create`.
# No image: native splash is just the solid Bunshin navy — the Flutter
# studio splash kicks in milliseconds later with the ghost mark + wordmark.
flutter_native_splash:
  color: "#0A1A2A"
  android_12:
    color: "#0A1A2A"
  ios: true
  android: true
  web: true

# Force a single compatible analyzer + plugin version to break a transitive
# clash between drift_dev (wants newer analyzer) and custom_lint chain
# (still ships analyzer_plugin 0.12.0). Drop these once the chain catches up.
dependency_overrides:
  analyzer: 7.5.7
  analyzer_plugin: 0.13.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/geo/mpa_simplified.geojson
